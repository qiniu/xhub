codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: 50..80
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 70%
        threshold: 1%

flag_management:
  default_rules:
    carryforward: true

flags:
  backend:
    carryforward: true
  frontend:
    carryforward: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: true
