        with:
          files: coverage/metadata-config.out
          flags: backend
          name: metadata-config
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
      - name: Archive metadata regression evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metadata-config-regression
          path: |
            .e2e/runs/
            coverage/metadata-config.out
          if-no-files-found: error
      # 预算配置与IAM旧入口使用真实HTTP/PostgreSQL回归，覆盖率报告独立上传。
      - name: Run real budget configuration regression
        env:
          XHUB_REGRESSION_COVERPROFILE: coverage/budget-config.out
        run: bash scripts/regression.sh '^Test(BudgetConfigService|BudgetConfigurationBoundary|LegacyIAMNoFalseSuccess)'
      - name: Validate budget regression coverage
        shell: bash
        run: |
          set -euo pipefail
          test -s coverage/budget-config.out
          go tool cover -func=coverage/budget-config.out | tail -1
      - name: Upload budget regression coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage/budget-config.out
          flags: backend
          name: budget-config
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
      - name: Archive budget regression evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: budget-config-regression
          path: |
            .e2e/runs/
            coverage/budget-config.out
          if-no-files-found: error
      # 运维假成功修复使用真实HTTP和数据库故障验证，覆盖率独立上传。
      - name: Run real operations boundary regression
        env:
          XHUB_REGRESSION_COVERPROFILE: coverage/operations-config.out
        run: bash scripts/regression.sh '^Test(OperationsNoFalseSuccess|ReadinessDetailsDatabaseFailure|HealthTestConnectionContract)$'
      - name: Validate operations regression coverage
        shell: bash
        run: |
          set -euo pipefail
          test -s coverage/operations-config.out
          go tool cover -func=coverage/operations-config.out | tail -1
      - name: Upload operations regression coverage
