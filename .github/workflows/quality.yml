        if: always()
        with:
          name: vector-config-regression
          path: |
            .e2e/runs/
            coverage/vector-config.out
          if-no-files-found: error
      # 与供应商契约共用隔离数据库基础设施，标签报告独立采集，不扩大契约覆盖声明。
      - name: Run real tag configuration regression
        env:
          XHUB_REGRESSION_COVERPROFILE: coverage/tag-catalog.out
        run: bash scripts/regression.sh '^TestTagCatalog'
      - name: Validate tag regression coverage
        shell: bash
        run: |
          set -euo pipefail
