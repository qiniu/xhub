name: Code Quality

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# 同一分支的新提交取代旧的质量检查，避免过期结果占用 runner。
concurrency:
  group: code-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Go 格式门禁要比较 PR 基线与当前提交，必须保留完整提交历史。
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # 多个测试会启动临时 Redis；网关和 IAM 套件使用 Compose PostgreSQL 的隔离 schema。
      - name: Prepare Go test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends redis-server
          if [[ ! -f configs/config.yaml ]]; then
            cp configs/config.example.yaml configs/config.yaml
          fi
          docker compose up -d --wait postgres redis
      - name: Check Go formatting
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha || github.event.before }}'
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}"; then
            base=$(git rev-parse HEAD^)
          fi
          mapfile -t changed_go_files < <(git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.go')
          if (( ${#changed_go_files[@]} == 0 )); then
            exit 0
          fi
          files=$(gofmt -l -- "${changed_go_files[@]}")
          if [[ -n "$files" ]]; then
            echo 'The following Go files need gofmt:' >&2
            echo "$files" >&2
            exit 1
          fi
      - name: Run Go vet
        run: go vet ./...
      - name: Run Go tests with coverage
        shell: bash
        env:
          XHUB_REGRESSION_STRICT: "1"
          XHUB_TEST_DATABASE_URL: postgres://xhub:xhub_dev_password@127.0.0.1:5433/xhub?sslmode=disable
        run: |
          set -euo pipefail
          mkdir -p coverage
          # cmd/regression 是由现有 Docker and Release/verify 作业单独执行的长时后台回归套件。
          # 这里覆盖所有 Go 单元包；下方契约作业另外采集真实 HTTP 回归并上传同一 backend 旗标，合并处理器覆盖证据。
          # 排除被 npm 带入的第三方 Go 源码。
          mapfile -t packages < <(go list ./... | grep -vE '/cmd/regression$|/frontend/node_modules/')
          go test -race -timeout=25m -covermode=atomic -coverprofile=coverage/go.out "${packages[@]}"
      - name: Print Go coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/go.out') != '' }}
        run: go tool cover -func=coverage/go.out | tail -1
      - name: Upload Go coverage
        if: ${{ !cancelled() && hashFiles('coverage/go.out') != '' }}
        uses: codecov/codecov-action@v5
        with:
          files: coverage/go.out
          flags: backend
          name: backend
          fail_ci_if_error: true
          use_oidc: true
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('coverage/go.out') != '' }}
        with:
          name: backend-coverage
          path: coverage/go.out
          if-no-files-found: error
      - run: docker compose down -v
        if: always()

  frontend:
    name: Frontend tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # ESLint 已有 289 个历史 error；先阻止错误数增长，后续随修复收紧基线。
      - name: Check ESLint error budget
        shell: bash
        run: |
          set -euo pipefail
          # ESLint 发现规则错误时返回 1；由预算脚本根据历史基线决定是否阻断。
          # 配置错误等返回 2 及以上时仍立即失败。
          set +e
          npx eslint . --quiet --format json --output-file eslint-report.json --pass-on-unpruned-suppressions
          lint_status=$?
          set -e
          if (( lint_status > 1 )); then
            exit "$lint_status"
          fi
          node scripts/check-eslint-error-budget.mjs eslint-report.json 289
      - name: Run frontend tests with coverage
        run: npm run test:quality
      - name: Upload ESLint report
        if: ${{ always() && hashFiles('frontend/eslint-report.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-eslint-report
          path: frontend/eslint-report.json
          if-no-files-found: error
      - name: Upload frontend coverage
        if: ${{ !cancelled() && hashFiles('frontend/coverage/lcov.info') != '' }}
        uses: codecov/codecov-action@v5
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          name: frontend
          fail_ci_if_error: true
          use_oidc: true
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('frontend/coverage/lcov.info') != '' }}
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: error
      - name: Remove generated lint report
        if: always()
        run: rm -f eslint-report.json

  workflow-regression:
    name: Workflow regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: node --test scripts/test_quality_workflow.cjs scripts/test_release_workflow.cjs scripts/test_dependabot.cjs frontend/tests/check-eslint-error-budget.test.mjs frontend/e2e/checklist-reporter.test.cjs frontend/e2e/gateway-response.test.cjs frontend/e2e/guard-resource-cleanup.test.cjs frontend/e2e/guard-resource-fixture.test.cjs frontend/e2e/policy-config-fixture.test.cjs
      - run: python3 -m unittest scripts.test_deploy_build scripts.test_regression_output scripts.test_makefile scripts.test_regression_results scripts.test_test_gates scripts.test_e2e_summary scripts.test_e2e_model_endpoints -v

  supplier-contract:
    name: Supplier API contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Check generated contract and TypeScript types
        run: npm --prefix frontend run check:api:suppliers
      - name: Test generator drift rejection
        run: node --test frontend/scripts/gen-supplier-contract.test.mjs
      - name: Validate OpenAPI and Go types
        run: go test -race ./contracts/suppliers
      # 真实 HTTP/PG 契约回归不可由仅检查文件的生成器测试代替。
      - name: Prepare contract database
        run: |
          cp configs/config.example.yaml configs/config.yaml
          docker compose up -d --wait postgres redis
      - name: Run real supplier contract regression
        env:
          XHUB_REGRESSION_COVERPROFILE: coverage/supplier-contract.out
        run: bash scripts/regression.sh '^TestSupplier(Contract|Service)'
      - name: Run real search configuration regression
        env:
          XHUB_REGRESSION_COVERPROFILE: coverage/search-config.out
        run: bash scripts/regression.sh '^Test(SearchConfigService|SearchProbe|CatalogIntegrity)'
      - name: Validate regression coverage
        shell: bash
        run: |
          set -euo pipefail
          test -s coverage/search-config.out
          go tool cover -func=coverage/search-config.out | tail -1
          test -s coverage/supplier-contract.out
          go tool cover -func=coverage/supplier-contract.out | tail -1
      - name: Upload regression coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage/supplier-contract.out,coverage/search-config.out
          flags: backend
          name: supplier-contract
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supplier-contract-regression
          path: |
            .e2e/runs/
            coverage/supplier-contract.out
            coverage/search-config.out
          if-no-files-found: error
      # 与供应商契约共用隔离数据库基础设施，提示词报告独立采集，不扩大契约覆盖声明。
      - name: Run real prompt configuration regression
        env:
          XHUB_REGRESSION_COVERPROFILE: coverage/prompt-config.out
        run: bash scripts/regression.sh '^Test(PromptConfigService|PromptProbe)'
      - name: Validate prompt regression coverage
        shell: bash
        run: |
          set -euo pipefail
          test -s coverage/prompt-config.out
          go tool cover -func=coverage/prompt-config.out | tail -1
      - name: Upload prompt regression coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage/prompt-config.out
          flags: backend
          name: prompt-config
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
      - name: Archive prompt regression evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prompt-config-regression
          path: |
            .e2e/runs/
            coverage/prompt-config.out
          if-no-files-found: error
      # 与供应商契约共用隔离数据库基础设施，策略报告独立采集，不扩大契约覆盖声明。
      - name: Run real policy configuration regression
        env:
          XHUB_REGRESSION_COVERPROFILE: coverage/policy-config.out
        run: bash scripts/regression.sh '^Test(PolicyConfigService|RuntimeOperationBoundary)'
      - name: Validate policy regression coverage
        shell: bash
        run: |
          set -euo pipefail
          test -s coverage/policy-config.out
          go tool cover -func=coverage/policy-config.out | tail -1
      - name: Upload policy regression coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage/policy-config.out
          flags: backend
          name: policy-config
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
      - name: Archive policy regression evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: policy-config-regression
          path: |
            .e2e/runs/
            coverage/policy-config.out
          if-no-files-found: error
      # 护栏真实回归独立采集覆盖率，不扩大第三阶段契约范围。
      - name: Run real guard management regression
        env:
          XHUB_REGRESSION_COVERPROFILE: coverage/guard-management.out
        run: bash scripts/regression.sh '^Test(GuardManagementService|Guardrail|XGoGuardrail)'
      - name: Validate guard regression coverage
        shell: bash
        run: |
          set -euo pipefail
          test -s coverage/guard-management.out
          go tool cover -func=coverage/guard-management.out | tail -1
      - name: Upload guard regression coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage/guard-management.out
          flags: backend
          name: guard-management
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
      - name: Archive guard regression evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guard-management-regression
          path: |
            .e2e/runs/
            coverage/guard-management.out
          if-no-files-found: error
      - run: docker compose down -v
        if: always()

