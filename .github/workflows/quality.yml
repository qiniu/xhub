          files: coverage/tag-catalog.out
          flags: backend
          name: tag-catalog
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
      - name: Archive tag regression evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tag-catalog-regression
          path: |
            .e2e/runs/
            coverage/tag-catalog.out
          if-no-files-found: error
      # 与供应商契约共用隔离数据库基础设施，元数据配置报告独立采集，不扩大契约覆盖声明。
      - name: Run real metadata configuration regression
        env:
          XHUB_REGRESSION_COVERPROFILE: coverage/metadata-config.out
        run: bash scripts/regression.sh '^Test(MetadataConfig|CustomerListReadFailure)'
      - name: Validate metadata regression coverage
        shell: bash
        run: |
          set -euo pipefail
          test -s coverage/metadata-config.out
          go tool cover -func=coverage/metadata-config.out | tail -1
      - name: Upload metadata regression coverage
